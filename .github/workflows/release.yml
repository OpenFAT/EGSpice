name: release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      variant:
        description: "Exact name from tools/release_matrix.py --list, or all (build only)"
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true # tests/conformance: the SPICE decks
      - id: plan
        env:
          VARIANT: ${{ inputs.variant || 'all' }}
          RELEASE_TAG: ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          python3 -m unittest discover -s tools -p 'test_release*.py'
          python3 tools/release.py plan >> "$GITHUB_OUTPUT"

  validate:
    needs: plan
    uses: ./.github/workflows/test.yml

  build:
    name: ${{ matrix.name }}
    needs: [plan, validate]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      VARIANT: ${{ matrix.name }}
      TARGET: ${{ matrix.target }}
      CPU: ${{ matrix.cpu }}
      GPU: ${{ matrix.gpu }}
      CUDA: ${{ matrix.cuda }}
      HIP: ${{ matrix.hip }}
      CPU_CHECK: ${{ matrix.check }}
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true # tests/conformance: the smoke decks
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc # v15
        with:
          name: omarsiwy
          skipPush: true

      # A GPU variant builds in the default shell, whose CUDA toolkit puts
      # ptxas and fatbinary on PATH: Gompute then embeds SASS for
      # -Dcuda-arch, so a matching card skips the driver's PTX JIT.
      - name: Build native archive
        run: >
          nix develop "$([ "$GPU" = true ] && echo . || echo .#ci)" -c zig build
          -Doptimize=ReleaseSafe -Dtarget="$TARGET" -Dcpu="$CPU"
          -Dgpu="$GPU" -Dcuda-arch="$CUDA" -Dhip-arch="$HIP"
          -j2 --prefix out --summary failures

      - name: Check runner CPU
        id: cpu
        shell: bash
        run: |
          runnable=true
          for feature in $CPU_CHECK; do
            if ! grep -qw "$feature" /proc/cpuinfo; then
              runnable=false
              echo "Runner lacks $feature" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "runnable=$runnable" >> "$GITHUB_OUTPUT"
          if [ "$runnable" = false ]; then
            echo "Built $VARIANT; CPU smoke unavailable on this runner." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Smoke native executable and runtime Verilog-A
        if: steps.cpu.outputs.runnable == 'true'
        run: nix develop .#ci -c bash tools/release_smoke.sh "$PWD/out/bin/espice" "$PWD/tests/conformance/tests/netlist"

      - name: Check CPU numerics at this instruction-set level
        if: matrix.gpu == false && steps.cpu.outputs.runnable == 'true'
        run: |
          nix develop .#ci -c zig build test \
            -Doptimize=ReleaseSafe -Dtarget="$TARGET" -Dcpu="$CPU" \
            -Dgpu=false -Dcuda-arch=none -Dhip-arch=none -j2 --summary failures

      - name: Package native archive
        shell: bash
        run: |
          mkdir -p dist
          name="espice-${VERSION}-${VARIANT}"
          cp README.md LICENSE CHANGELOGS.md out/
          python3 tools/release.py metadata "$VARIANT" "$VERSION" "${{ steps.cpu.outputs.runnable }}" > out/BUILD.json
          mv out "$name"
          tar czf "dist/$name.tar.gz" "$name"

      # The tree just archived, plus the Zig it was built with, for runtime .hdl.
      - name: Distro packages (.deb, .rpm, Arch)
        if: matrix.distro
        run: bash tools/package.sh "espice-${VERSION}-${VARIANT}" "$VERSION" "${{ matrix.deb_arch }}" dist

      - name: Smoke distro packages in clean Ubuntu, Debian, Fedora, openSUSE and Arch
        if: matrix.distro && steps.cpu.outputs.runnable == 'true'
        run: bash tools/distro_smoke.sh dist "$VERSION" "${{ matrix.deb_arch }}" tests/conformance/tests/netlist

      - name: Bundle Linux runtime closure
        if: matrix.bundle
        run: |
          test "$(nix eval --raw ".#$PACKAGE.version")" = "$VERSION"
          nix bundle --bundler . --out-link bundle ".#$PACKAGE" --cores 2 --max-jobs 1 --print-build-logs
          test -f bundle
          cp -L bundle "dist/espice-${VERSION}-${VARIANT}.run"
          chmod +x "dist/espice-${VERSION}-${VARIANT}.run"

      # No /nix mount and no network: the bundle must carry its own runtime,
      # including Zig for .hdl. User namespaces are needed by nix-bundle.
      - name: Smoke bundle outside Nix
        if: matrix.bundle && steps.cpu.outputs.runnable == 'true'
        run: |
          docker build -t espice-bundle-smoke -f tools/release-container.Dockerfile tools
          docker run --rm --network none \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -v "$PWD/dist:/artifacts:ro" -v "$PWD/tests/conformance/tests/netlist:/fixtures:ro" \
            -v "$PWD/tools/release_smoke.sh:/smoke.sh:ro" \
            espice-bundle-smoke sh -ec 'test ! -e /nix/store; bash /smoke.sh "$1" /fixtures' \
            sh "/artifacts/espice-${VERSION}-${VARIANT}.run"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [plan, build]
    if: github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify complete release and write checksums
        run: python3 tools/release.py verify dist "$VERSION"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          fail_on_unmatched_files: true
          prerelease: ${{ contains(needs.plan.outputs.version, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.run
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/PKGBUILD
            dist/espice.rb
            dist/SHA256SUMS
            dist/BUILD-MATRIX.json

  # sources.json is what `nix run '.#"<version>"'` and `.#latest` install, so
  # the release just uploaded is added to it on main through a pull request
  # like any other change (bots never push to main). A GITHUB_TOKEN pull
  # request starts no workflow, but a workflow_dispatch does, so the job
  # dispatches the required checks on the branch and auto-merge lands it.
  sources:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Regenerate sources.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/update-sources.py
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: The new release binary installs and runs (checks.release)
        run: |
          git diff --quiet sources.json && exit 0
          nix flake check --no-build
          nix build -L .#checks.x86_64-linux.release
      - name: Pull request, gated, auto-merged
        run: |
          git diff --quiet sources.json && exit 0
          branch="sources/$TAG"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -m "nix: sources.json for $TAG" -- sources.json
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "nix: sources.json for $TAG" \
            --body "Generated by release.yml from the $TAG assets and SHA256SUMS; \`checks.release\` passed on it."
          for w in test.yml cross.yml nix.yml; do
            gh workflow run "$w" --ref "$branch"
          done
          gh pr merge "$branch" --auto --squash

  # The formula the release attached, installed through a local tap on macOS
  # and checked by `brew test` (a divider solved to its analytic value). With a
  # HOMEBREW_TAP_TOKEN secret (a token that can push to OmarSiwy/homebrew-espice)
  # it is pushed to the tap. After VerA's publish.yaml.
  homebrew:
    needs: [plan, publish]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Install and test the formula
        run: |
          set -euo pipefail
          gh release download "v$VERSION" -R "$GITHUB_REPOSITORY" -p espice.rb
          brew tap-new --no-git espice/local
          cp espice.rb "$(brew --repository espice/local)/Formula/espice.rb"
          brew install espice/local/espice
          brew test espice/local/espice
          espice --version
      - name: Push to OmarSiwy/homebrew-espice
        if: env.TAP_TOKEN != ''
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/OmarSiwy/homebrew-espice.git" tap
          mkdir -p tap/Formula && cp espice.rb tap/Formula/espice.rb
          cd tap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/espice.rb
          git diff --cached --quiet || { git commit -m "espice v$VERSION"; git push; }

  # The AUR package the release attached: makepkg in Arch downloads the
  # uploaded .deb, checks it against the PKGBUILD's sha256, and the package it
  # builds must install and run. With an AUR_SSH_PRIVATE_KEY secret (an AUR
  # account's key) the PKGBUILD and its .SRCINFO are pushed to espice-bin.
  aur:
    needs: [plan, publish]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - name: Build, install and run espice-bin
        run: |
          set -euo pipefail
          mkdir aur && cd aur
          gh release download "v$VERSION" -R "$GITHUB_REPOSITORY" -p PKGBUILD
          docker run --rm -v "$PWD:/aur" docker.io/library/archlinux:latest sh -c '
            set -e
            pacman -Sy --noconfirm --needed base-devel >/dev/null
            useradd -m builder && chown -R builder /aur
            su builder -c "cd /aur && makepkg --noconfirm && makepkg --printsrcinfo > .SRCINFO"
            pacman -U --noconfirm /aur/espice-bin-*.pkg.tar.zst >/dev/null
            espice --version'
      - name: Push to the AUR
        if: env.AUR_KEY != ''
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && printf '%s\n' "$AUR_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          # ponytail: trust on first use from a fresh runner; pin AUR's host key here if that matters.
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur"
          git clone ssh://aur@aur.archlinux.org/espice-bin.git espice-bin
          cp aur/PKGBUILD aur/.SRCINFO espice-bin/
          cd espice-bin
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet || { git commit -m "espice-bin $VERSION"; git push; }
