name: test

# The merge gate: every unit suite, the codegen probes,
# and the full fixture corpus with its verdict name list,
# in the shipped mode (ReleaseSafe: LLVM with every safety check on).
# ponytail: no Debug job. Debug builds use the self-hosted backend, which
# diverges from LLVM (#25: numeric results, a pthread_create EINVAL, an
# allocation count); add `zig build test -Doptimize=Debug` once #25 closes.
# HIP codegen runs without a GPU; the GPU corpus (`zig build test-gpu`) needs
# an NVIDIA runner and runs locally until one exists.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  release-safe:
    runs-on: ubuntu-latest
    # ~7400 CPU-seconds of compile + tests; a 4-core runner needs over an hour.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v15
        with:
          name: omarsiwy
          skipPush: true
      - name: Release matrix and publication checks
        run: nix develop .#ci -c python3 -m unittest discover -s tools -p 'test_release*.py'
      - name: Compile HIP state kernels
        run: nix develop .#ci -c zig build test-hip-codegen -Doptimize=Debug -Dgpu=false -Dcuda-arch=none -Dhip-arch=none -j2 --summary failures
      - run: nix develop .#ci -c zig build test -Dgpu=false -Doptimize=ReleaseSafe -j2 --summary failures
