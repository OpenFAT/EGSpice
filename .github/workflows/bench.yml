name: bench

# On every release tag: time the fixture corpus in ESPice, ngspice and VACASK
# (`zig build bench`) and attach the charts, summary and report to the release.
# ponytail: a shared 4-vCPU hosted runner, so absolute times are noisy; the
# speedups are ratios of runs on the same machine. Self-host when they wobble.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true # tests/conformance: the SPICE decks

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc # v15
        with:
          name: omarsiwy
          skipPush: true

      # The shipped build (release.yml's kernels) in the benchmarking shell,
      # GPU toolchain included; the runner has no GPU, so decks run on the CPU.
      - name: Bench
        run: >
          nix develop .#benchmarking -c zig build bench
          -Doptimize=ReleaseFast -Dcuda-arch=sm_75 -Dhip-arch=gfx1100
          -- --iters 3

      # Generated files stay off main: the charts ship as a release asset (or a
      # run artifact for a manual run):
      #   gh release download vX -p bench-corpus.tar.gz && tar xzf bench-corpus.tar.gz
      - name: Plot
        run: |
          out=bench-corpus
          rm -rf "$out"
          nix develop .#benchmarking -c python3 tools/bench_plot.py \
            zig-out/benchmark-results.md tests/conformance/tests/netlist "$out"
          cp zig-out/benchmark-results.md "$out/results.md"
          tar czf bench-corpus.tar.gz "$out"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-corpus
          path: bench-corpus.tar.gz

      - name: Attach to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" bench-corpus.tar.gz --clobber
