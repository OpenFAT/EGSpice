name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
      - "include/espice.h"
      - "src/**"
      - "models/**"
      - "tools/playground/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true # tests/conformance: the SPICE decks

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The in-browser playground (tools/playground/, its own build root):
      # espice.wasm and cktimg.wasm, served from docs/wasm/ next to
      # javascripts/playground.js. The C API example runs in `zig build test`.
      # ponytail: continue-on-error while wasm32 does not compile (the
      # performance round's u64/usize sites in src/solver and src/analysis);
      # drop it once this step goes green, so a broken playground fails the deploy.
      - name: Playground
        id: playground
        continue-on-error: true
        run: |
          cd tools/playground
          nix develop ../..#ci -c zig build
          mkdir -p ../../docs/wasm
          cp zig-out/wasm/*.wasm ../../docs/wasm/

      # Differential oracle: every corpus deck the browser can run, through
      # espice.wasm and through a native espice of the same lane width
      # (baseline x86_64: two f64 lanes, as simd128 has), within 1e-9.
      - name: Playground against native
        if: steps.playground.outcome == 'success'
        run: |
          nix develop .#ci -c zig build -Doptimize=ReleaseSafe -Dcpu=x86_64 -Dgpu=false -Dcuda-arch=none -Dhip-arch=none --prefix native
          nix shell nixpkgs#nodejs -c node tools/playground/compare.js tools/playground/zig-out/wasm native/bin/espice tests/conformance/tests/netlist

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: MkDocs
        run: |
          pip install "mkdocs==1.6.1" "mkdocs-material==9.7.6"
          mkdocs build --strict

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
